# `cargo deploy` — build the release binary and copy it to where you run it from.
#
# An alias can only stand for a cargo subcommand, so it cannot copy anything itself; what it
# stands for here is a small program that builds and then copies. That program is
# `azur_egui_theme::deploy`, shared with the other Azur applications, and its documentation
# explains why it is reached through an example target. `examples/deploy.rs` is one call to it.
#
#   cargo deploy                  release build -> D:\Programs (or $AZUR_DEPLOY_DIR)
#   cargo deploy E:\Tools         somewhere else
#   cargo deploy --debug          the debug build, for once
#   cargo deploy --profile fast   the iteration profile
#
# `--release` is for building *the helper*, not for choosing what gets deployed — the helper
# decides that, and defaults to release. It is here so that compiling the helper needs only the
# dependencies the release build is about to want anyway, rather than a second debug copy of
# eframe and wgpu on a fresh clone. It is also why the helper is not built under `fast`: a
# second profile means a second copy of every dependency, which costs more than it saves.

# `cargo claude-*` -- the same commands, built somewhere else.
#
# An assistant working in this repository shares one `target/` with whoever is sitting at
# it, and sharing `target/debug` is what makes the two of them slow: cargo keys its
# fingerprints on the profile, so an agent's `cargo test` and an editor's rust-analyzer
# take turns invalidating each other's artifacts and every build is a rebuild. On Windows
# they also take turns *locking* them -- "did not finalize incremental compilation session
# directory: Access denied" is that collision, and the work of that compilation is lost.
#
# So the agent gets its own profile, which gets its own directory. `[profile.claude]` in
# `Cargo.toml` inherits `dev` and changes nothing else, so what these build is the same
# code the developer's `cargo build` builds -- in `target/claude` instead of `target/debug`.
#
#   cargo claude-build            target/claude, leaving target/debug alone
#   cargo claude-test             the same, for the test binaries
#   cargo claude-clippy           `-D warnings` is deliberate; see below
#   cargo claude-doc              checks the intra-doc links this codebase leans on
#   cargo claude-run              the window, out of the developer's artifacts
#
# `claude-clippy` denies warnings rather than printing them because an agent reading its
# own output cannot be relied upon to notice a warning it did not cause; a non-zero exit it
# cannot miss.
#
# Note what `claude-run` does *not* do: this program has no `--profile` of its own, so it
# reads and writes the one `%APPDATA%\Azur Tasks\settings.ini` a person's window
# layout and column widths live in. Until it has one, running it from here costs them that
# layout -- the sibling widget grew a `--profile` flag for exactly this reason.
[alias]
deploy = "run --quiet --release --example deploy --"
claude-build = "build --profile claude"
claude-run = "run --profile claude"
claude-test = "test --profile claude"
claude-clippy = "clippy --profile claude --all-targets -- -D warnings"
claude-doc = "doc --profile claude --no-deps"
