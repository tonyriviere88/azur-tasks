[package]
name = "azur-task-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Azur Task Manager - a fast, low-footprint Windows task manager"
publish = false

# `src/bin/memprobe.rs` is a second binary -- a bare eframe window, for telling
# framework memory cost apart from ours -- which is enough to make `cargo run`
# refuse to guess. Name the application, so the plain commands mean the
# application and the probe is the one that has to be asked for by name.
default-run = "azur-task-manager"

[[bin]]
name = "azur-task-manager"
path = "src/main.rs"

# The probe is a measurement tool, not part of the product: it is built only when
# asked for. `required-features` is what makes `cargo build` skip it rather than
# link a second eframe window on every build of the application.
#
#   cargo run --features memprobe --bin memprobe
[[bin]]
name = "memprobe"
path = "src/bin/memprobe.rs"
required-features = ["memprobe"]

[features]
# Account for live heap bytes and print them each tick. Costs two atomics per
# allocation, so it is a build-time opt-in rather than a runtime flag.
memtrace = []

# Build the `memprobe` binary. Adds no code to the application -- it exists only
# to gate that target, since a bin cannot be opted out of any other way.
memprobe = []

[dependencies]
# UI: immediate-mode, GPU-composited through wgpu -> Vulkan.
#
# Three feature decisions here, and all three are worth 25.6% of the executable
# together. Every number below came out of a linked binary, not a linker map.
#
# **`wgpu_no_default_features`, never `wgpu`.** eframe's own `wgpu` feature is
# defined as `["wgpu_no_default_features", "egui-wgpu/default"]`, and
# `egui-wgpu/default` contains `wgpu/default`, which is *every backend wgpu has*.
# Taking it re-enabled D3D12 and both GL paths on top of the single backend
# `azur-egui-theme` pins -- which is where the backend decision belongs, and which
# says so at length in its own manifest. Nothing in a dependency can prevent this;
# it has to be written here. Measured: **1,059,840 bytes**, against the 78,272 a
# linker map attributed to the dx12 and gles crates -- 13x, because a map prices the
# code that is there and only a build shows what *leaves with* a feature (naga's
# HLSL and GLSL writers, `range-alloc`, gpu-allocator's D3D12 path, and most of the
# `windows` crate).
#
# **No `default_fonts`.** It embedded epaint's four TrueType files -- NotoEmoji
# 418,804, Ubuntu-Light 361,676, emoji-icon-font 324,132, Hack 309,408 -- as the
# four largest objects in the binary, and `azur-egui-theme::fonts` installs from
# `FontDefinitions::empty()`, so not one of them could ever be drawn with. They were
# 12% of the executable that no code path could reach. Measured: **1,418,240 bytes**,
# and nothing changes on screen; the theme's own doc predicted this exact regression
# ("any crate anywhere in a consumer's graph that enables it turns the four back on
# for everybody, and the cost would reappear silently").
#
# **No `glow`.** A second renderer -- `egui_glow`, `glutin`, `glow` -- kept for a
# machine that has never been reported. Measured: **205,824 bytes**. `AZTM_RENDERER`
# went with it rather than being left as a name this build can no longer honour, and
# `memprobe` is wgpu-only; the OpenGL measurements it produced are recorded in the
# README, which is what they were for.
eframe = { version = "0.35", default-features = false, features = [
    "wgpu_no_default_features",
] }
egui = { version = "0.35", default-features = false }

# Palette, semantic roles and egui styling. Its egui must stay in lockstep with
# the one above: two egui versions in the graph would be two `Context` types,
# and the theme would style neither.
azur-egui-theme = { path = "../azur-egui-theme" }

# Lock-free snapshot handoff from the sampler thread to the UI thread.
arc-swap = "1.9"

# Fast, non-DoS-resistant hashing. We hash PIDs, not attacker input.
rustc-hash = "2.1"

# Cheaper, smaller mutexes than std for the few places we need them.
parking_lot = "0.12"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # `AttachConsole`, so that the memtrace diagnostics and a panic reach a shell. This
    # binary is a `windows` subsystem binary in every profile, so it has no standard
    # handles of its own and has to borrow the parent's -- see `sys::util`.
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# **`z` for the code that runs once.** `opt-level = 3` is what makes a table of a
# thousand live rows feel like one, and none of the three crates below is on the frame
# path: `naga` parses this program's WGSL, validates the IR and writes SPIR-V exactly
# once, at pipeline creation, while the window is still hidden; `codespan-reporting`
# formats a shader error that has never happened; `hexf-parse` reads float literals
# out of the shader source.
#
# Worth **555,008 bytes**, which is a fifth of `naga` -- 1,458,443 of them by linker
# map, the largest crate in the binary after `core` -- for about 30 seconds of release
# build time. Verified where the risk is: window-open to first painted frame is
# unchanged (see below), which is the only thing optimising a startup-only crate for
# size could have cost.
[profile.release.package.naga]
opt-level = "z"
[profile.release.package.codespan-reporting]
opt-level = "z"
[profile.release.package.hexf-parse]
opt-level = "z"

# Not here, and measured rather than assumed: `image` and `png` decode three icons at
# startup and nothing afterwards, which looks like exactly the same case as `naga` --
# and `opt-level = "z"` on both is worth **1,024 bytes**. Their code is monomorphised
# into the caller's codegen unit, where a per-package profile does not reach it. The
# same is true of any small generic crate; measure before adding one to this list.

# Iteration profile: release code generation without the two settings that make
# a one-line change cost two minutes. `lto = "fat"` re-runs cross-crate
# optimization over the whole graph on every link, and `codegen-units = 1`
# refuses to use more than one core doing it. Neither changes behaviour, so this
# is the profile to develop against; ship with `--release`.
#
#   cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = "none"

# The profile behind `cargo claude-*` -- see the aliases in `.cargo/config.toml`.
#
# `dev` and nothing else, on purpose: what an assistant builds has to be what the
# developer builds, or a green agent run says nothing about the repository. Not `fast`
# either, tempting as a release-grade profile looks for a program whose whole subject is
# latency -- `fast` is the profile to *measure* on, and a second builder competing for the
# machine is the condition under which a measurement means least.
#
# All this buys is the *directory*, and that is enough. Cargo puts a custom profile's
# artifacts in `target/<name>`, so two builders stop invalidating one shared
# `target/debug` -- and on Windows stop taking turns locking it, which is what "did not
# finalize incremental compilation session directory: Access denied" is, and that
# compilation's work is thrown away when it happens. Cargo copies a parent's package
# overrides along with the rest, so `[profile.dev.package."*"]` below still reaches
# dependencies here (checked: a dependency compiles at `opt-level=3` under this profile)
# -- which matters, because a debug-build wgpu would make the window unusable.
#
# No `strip`, no `opt-level`, no `debug = 0`: every one of those would be a second set of
# compiler flags to hold in mind when a test passes here and fails there.
[profile.claude]
inherits = "dev"

# Keep dependencies optimized in dev builds too; a debug-build wgpu is unusably
# slow and would make the latency work impossible to evaluate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
